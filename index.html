<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Secret Invitation</title>
  
  <!-- Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden; 
      background-image: url('background.gif'); /* Your Stardew pixelated background */
      background-size: cover;       
      background-position: center;  
      background-repeat: no-repeat;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.158);
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.6s ease-in-out;
      z-index: 10;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto; 
      cursor: pointer;
    }

    .mail-container {
      position: relative;
      width: 300px;
      height: 200px;
      cursor: pointer;
      z-index: 11; 
    }

    /* 1. Stardew Envelope Back */
    .envelope-back {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #a86f45; /* Darker parchment brown */
      border-radius: 0 0 10px 10px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      z-index: 1;
    }

    /* 2. The Stardew Letter (Your image goes here) */
    .card {
      position: absolute;
      top: 10px; left: 10px;
      width: 280px; height: 180px;
      background-color: #f7d8a5; /* Fallback paper color */
      background-image: url('sv_letter.png'); /* The SV pixelated letter you cropped */
      background-size: 100% 100%;
      image-rendering: pixelated; 
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
      z-index: 2; 
      font-family: 'Pixelify Sans', sans-serif;
      color: #3b170a;
      line-height: 1.4;
      text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.3);
    }
    .card h2 { font-weight: 700; margin-top: 0; font-size: 20px; margin-bottom: 10px; }
    .card p { font-size: 12px; margin: 0; }

    /* 3. Stardew Envelope Front Folds */
    .envelope-front {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none; 
    }
    .fold-left {
      position: absolute; top: 0; left: 0;
      border-top: 100px solid transparent; border-bottom: 100px solid transparent;
      border-left: 150px solid #c28455;
    }
    .fold-right {
      position: absolute; top: 0; right: 0;
      border-top: 100px solid transparent; border-bottom: 100px solid transparent;
      border-right: 150px solid #c28455;
    }
    .fold-bottom {
      position: absolute; bottom: 0; left: 0;
      border-left: 150px solid transparent; border-right: 150px solid transparent;
      border-bottom: 100px solid #d49563;
    }

    /* 4. Stardew Envelope Flap & Wax Seal */
    .flap {
      position: absolute;
      top: 0; left: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 110px solid #e0a473; 
      transform-origin: top;
      z-index: 4; 
      pointer-events: none;
    }
    
    /* The Red Wax Seal */
    .wax-seal {
      position: absolute;
      top: 90px;
      left: 130px;
      width: 40px;
      height: 40px;
      background-color: #a62828;
      border-radius: 50%;
      z-index: 5;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    /* --- ANIMATION RULES --- */
    .card, .flap, .envelope-back, .envelope-front {
      transition: transform 0.6s ease-in-out, z-index 0s 0.3s, box-shadow 0.6s ease-in-out;
    }

    /* Step 1: Flap Opens & Seal Breaks */
    .mail-container.flap-open .flap {
      transform: rotateX(180deg);
      z-index: 1; 
    }
    .mail-container.flap-open .wax-seal {
      opacity: 0; /* Seal vanishes as if broken */
    }

    /* Step 2: Letter Slides Up */
    .mail-container.card-slide .card {
      transform: translateY(-120px); 
    }

    /* Step 3: Envelope Drops Down & Letter Zooms In */
    .mail-container.zoom-in .envelope-back,
    .mail-container.zoom-in .envelope-front {
      transform: translateY(100vh); 
    }
    .mail-container.zoom-in .flap {
      transform: translateY(100vh) rotateX(180deg); 
    }
    .mail-container.zoom-in .card {
      transform: translateY(0) scale(1.6); 
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      z-index: 15; 
      cursor: default;
    }

    .layout {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      gap: 10px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Pixelify Sans', sans-serif;
      color: #6B3710;
    }
    #test-title {
      transition: opacity 0.4s ease-in-out;
    }

    #test-title.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  
  <div class="overlay" id="overlay"></div>
  <div class="layout">
    <h1 id="test-title">You've Got Mail!</h1>
    <div class="mail-container" id="mail">
      
      <!-- The physical envelope back -->
      <div class="envelope-back"></div>
      
      <!-- The Letter -->
      <div class="card" id="card">
        <h2>You have been invited to a date!</h2>
        <p>Join me for dinner at Ebi10 in Eastwood on June 12 at 5 pm. </p>
        <p>-Hans Tuballa</p>
      </div>
      
      <!-- The physical envelope front and flap -->
      <div class="envelope-front">
        <div class="fold-left"></div>
        <div class="fold-right"></div>
        <div class="fold-bottom"></div>
      </div>
      <div class="flap"></div>
      
      <!-- The Wax Seal -->
      <div class="wax-seal"></div>

    </div>
  </div>
  

  <script>
    const mail = document.getElementById('mail');
    const overlay = document.getElementById('overlay');
    const testTitle = document.getElementById('test-title'); // 1. Select the title
    
    let isAnimating = false; 
    let isOpen = false;

    mail.addEventListener('click', () => {
      if (isOpen || isAnimating) return;
      isAnimating = true;
      isOpen = true;

      // 2. Hide the title when opening
      testTitle.classList.add('hidden'); 

      mail.classList.add('flap-open');

      setTimeout(() => {
        mail.classList.add('card-slide');
        
        setTimeout(() => {
          mail.classList.add('zoom-in');
          overlay.classList.add('active');
          isAnimating = false; 
        }, 600);

      }, 600); 
    });

    overlay.addEventListener('click', () => {
      if (!isOpen || isAnimating) return;
      isAnimating = true;
      isOpen = false;

      // 3. Show the title when closing
      testTitle.classList.remove('hidden');

      mail.classList.remove('zoom-in');
      overlay.classList.remove('active');

      setTimeout(() => {
        mail.classList.remove('card-slide');

        setTimeout(() => {
          mail.classList.remove('flap-open');
          isAnimating = false;
        }, 600);

      }, 600);
    });
  </script>

</body>
</html>
